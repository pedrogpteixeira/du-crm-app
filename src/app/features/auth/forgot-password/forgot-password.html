<div class="recovery-page">
  <section class="recovery-card">
    <header class="recovery-header">
      <div class="brand-icon">Certo</div>

      <div>
        <span class="eyebrow">Segurança</span>
        <h1>Recuperar palavra-passe</h1>
        <p>
          Introduza o endereço de email associado à sua conta. Enviaremos um
          link para definir uma nova palavra-passe.
        </p>
      </div>
    </header>

    <div class="state-panel success" *ngIf="requestSent; else recoveryForm">
      <div class="state-heading">
        <span class="material-symbols-rounded" aria-hidden="true">mark_email_read</span>
        <span>Verifique o seu email</span>
      </div>

      <p>{{ confirmationMessage }}</p>

      <div class="state-actions">
        <a class="primary-button" routerLink="/login">Voltar ao login</a>
      </div>
    </div>

    <ng-template #recoveryForm>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          <span>Email</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            placeholder="utilizador@empresa.pt"
            [class.invalid]="form.controls.email.touched && form.controls.email.invalid"
          />
          <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.hasError('required')">
            Introduza o seu endereço de email.
          </small>
          <small class="field-error" *ngIf="form.controls.email.touched && form.controls.email.hasError('email')">
            Introduza um endereço de email válido.
          </small>
        </label>

        <p class="request-error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button class="primary-button" type="submit" [disabled]="form.invalid || isSubmitting">
          {{ isSubmitting ? 'A enviar instruções...' : 'Enviar instruções' }}
        </button>
      </form>

      <footer class="recovery-footer">
        <a routerLink="/login">Voltar ao login</a>
      </footer>
    </ng-template>
  </section>
</div>
