<div
  class="ticket-modal-backdrop"
  (click)="close()"
>
  <section
    class="ticket-modal"
    role="dialog"
    aria-modal="true"
    aria-labelledby="ticket-create-title"
    (click)="$event.stopPropagation()"
  >
    <header class="ticket-modal-header">
      <div>
        <h2 id="ticket-create-title">Novo Ticket</h2>
        <p>
          O Ticket será associado automaticamente ao contrato atual.
        </p>
      </div>

      <button
        type="button"
        class="icon-button"
        aria-label="Fechar"
        [disabled]="isCreatingTicket || isUploadingAttachments"
        (click)="close()"
      >
        ×
      </button>
    </header>

    <div class="ticket-modal-body">
      <p
        class="loading-message"
        *ngIf="isLoadingAssignment"
      >
        A carregar utilizadores e equipas...
      </p>

      <div
        class="ticket-form-grid two-columns"
        *ngIf="!isLoadingAssignment"
      >
        <label>
          Tipo *

          <select
            [(ngModel)]="tipo"
            [disabled]="isCreatingTicket"
          >
            <option
              *ngFor="let option of ticketTypeOptions"
              [value]="option"
            >
              {{ option }}
            </option>
          </select>
        </label>

        <label>
          Prioridade

          <select
            [(ngModel)]="prioridade"
            [disabled]="isCreatingTicket"
          >
            <option
              *ngFor="let option of priorityOptions"
              [value]="option"
            >
              {{ option }}
            </option>
          </select>
        </label>

        <label>
          Responsável *

          <select
            [(ngModel)]="assignedUserId"
            [disabled]="
              isCreatingTicket ||
              !canAssignOtherUsers()
            "
            (ngModelChange)="onAssignedUserChange()"
          >
            <option value="" disabled>
              Selecionar utilizador
            </option>

            <option
              *ngFor="let user of assignableUsers"
              [value]="user.id"
            >
              {{ user.name }} — {{ user.username }}
            </option>
          </select>
        </label>

        <label>
          Agendamento

          <input
            type="datetime-local"
            [(ngModel)]="agendamento"
            [disabled]="isCreatingTicket"
          />
        </label>
      </div>

      <div
        class="team-selection"
        *ngIf="!isLoadingAssignment"
      >
        <span class="field-label">Equipas *</span>

        <div
          class="selected-team-tags"
          *ngIf="selectedTeams.length"
        >
          <span
            class="team-tag"
            *ngFor="let team of selectedTeams"
          >
            {{ team.name }} — {{ team.position }}

            <button
              type="button"
              class="remove-team-button"
              [disabled]="isCreatingTicket || isRequiredTeam(team.id)"
              [attr.aria-label]="'Remover equipa ' + team.name"
              (click)="removeSelectedTeam(team.id)"
            >
              ×
            </button>
          </span>
        </div>

        <div class="team-add-row">
          <select
            [(ngModel)]="teamToAddId"
            [disabled]="
              isCreatingTicket ||
              !teamsAvailableToAdd.length
            "
          >
            <option value="">
              {{
                teamsAvailableToAdd.length
                  ? 'Adicionar equipa...'
                  : 'Sem mais equipas disponíveis'
              }}
            </option>

            <option
              *ngFor="let team of teamsAvailableToAdd"
              [value]="team.id"
            >
              {{ team.name }} — {{ team.position }}
            </option>
          </select>

          <button
            type="button"
            class="secondary-button"
            [disabled]="isCreatingTicket || !teamToAddId"
            (click)="addSelectedTeam()"
          >
            Adicionar
          </button>
        </div>
      </div>

      <label class="description-field">
        Descrição

        <textarea
          rows="4"
          [(ngModel)]="descricao"
          [disabled]="isCreatingTicket"
          placeholder="Descreva o pedido ou a pendência..."
        ></textarea>
      </label>

      <div class="attachments-field">
        <span class="field-label">Anexos</span>

        <app-file-dropzone
          [(files)]="selectedFiles"
          [disabled]="isCreatingTicket || isUploadingAttachments"
        />
      </div>

      <p
        class="error-message"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </p>
    </div>

    <footer class="ticket-modal-actions">
      <button
        type="button"
        class="secondary-button"
        [disabled]="isCreatingTicket || isUploadingAttachments"
        (click)="close()"
      >
        Cancelar
      </button>

      <button
        type="button"
        class="primary-button"
        [disabled]="
          isLoadingAssignment ||
          isCreatingTicket ||
          isUploadingAttachments ||
          !contractId ||
          !companyId
        "
        (click)="submit()"
      >
        {{
          isUploadingAttachments
            ? 'A carregar anexos...'
            : isCreatingTicket
              ? 'A criar Ticket...'
              : 'Criar Ticket'
        }}
      </button>
    </footer>
  </section>
</div>
